name: Build debug APK

on:
  workflow_dispatch:
  # Pull-request builds can restore the signing cache from the octopus-mvp base branch.
  # The separate build branch cannot access that cache via workflow_dispatch or push.
  pull_request:
    branches: [ octopus-mvp ]
    paths:
      - 'app/**'
      - '.github/workflows/build-debug-apk.yml'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Restore stable debug signing key
        id: debug-keystore-cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.android/debug.keystore
          key: heliboard-octopus-debug-keystore-v2

      - name: Ensure stable debug signing key exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Save stable debug signing key
        if: steps.debug-keystore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.android/debug.keystore
          key: heliboard-octopus-debug-keystore-v2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Show cached signing certificate
        run: |
          keytool -list -v             -keystore "$HOME/.android/debug.keystore"             -storepass android             -alias androiddebugkey | grep -E 'SHA256:|Valid from:'

      - name: Require original Octopus signing certificate
        run: |
          EXPECTED="36:19:34:24:BF:46:D3:32:41:F3:35:2C:C5:2F:46:4C:DB:8F:13:15:07:0D:32:D8:96:FE:9C:7B:E3:F3:07:60"
          ACTUAL="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -1)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signing certificate differs from the original Octopus26 certificate; refusing to publish an incompatible APK."
            exit 1
          fi

      - name: Prepare optional Firebase beta configuration
        env:
          OCTOPUS_FIREBASE_JSON_B64: ${{ secrets.OCTOPUS_FIREBASE_JSON_B64 }}
        run: |
          if [ -n "$OCTOPUS_FIREBASE_JSON_B64" ]; then
            printf '%s' "$OCTOPUS_FIREBASE_JSON_B64" | base64 --decode > app/google-services.json
          else
            echo "No Firebase config secret. Building without active Crashlytics."
          fi

      - name: Build with Gradle
        env:
          OCTOPUS_DEBUG_KEYSTORE: /home/runner/.android/debug.keystore
        run: ./gradlew assembleDebug

      - name: Verify APK uses cached signing certificate
        run: |
          APK="$(find app/build/outputs/apk/debug -name '*-debug*.apk' -print -quit)"
          KEY_SHA="$(keytool -list -v             -keystore "$HOME/.android/debug.keystore"             -storepass android             -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -1)"
          APK_SHA="$(keytool -printcert -jarfile "$APK" | sed -n 's/.*SHA256: //p' | head -1)"
          echo "Cached key SHA256: $KEY_SHA"
          echo "Built APK SHA256:  $APK_SHA"
          test -n "$KEY_SHA"
          test "$KEY_SHA" = "$APK_SHA"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Octopus-Keyboard-debug
          path: app/build/outputs/apk/debug/*-debug*.apk

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}
